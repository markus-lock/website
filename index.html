<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f4">
  <title>Websites</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #292929;
      background: #f5f5f4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    nav {
      display: grid;
      gap: 0.75rem;
    }

    a {
      min-width: min(100%, 22rem);
      padding: 1rem 1.5rem;
      border: 1px solid #e5e5e4;
      border-radius: 0.75rem;
      background: #fff;
      color: inherit;
      font-size: 1.125rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      transition: background-color 160ms ease, border-color 160ms ease;
    }

    a:hover {
      border-color: #d4d4d4;
      background: #fafafa;
    }

    a:focus-visible {
      outline: 3px solid #a3a3a3;
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      a {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <nav aria-label="Websites">
    <a href="knoglepunkter">Knoglepunkter</a>
    <a href="vaevsskade/">Vævsskade og heling</a>
  </nav>
</body>
</html>
